<script>let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(window.innerWidth<=768&&localStorage.getItem('pwaPromptDismissed')!=='1'){setTimeout(()=>document.getElementById('pwaInstallModal').style.display='flex',600)}});function triggerPWAInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(c=>{deferredPrompt=null;closePWAModal()})}}function closePWAModal(){document.getElementById('pwaInstallModal').style.display='none';localStorage.setItem('pwaPromptDismissed','1')}</script>
